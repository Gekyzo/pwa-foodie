<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)">
    <title>Food roulette - Spinach</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-action" class="button strong" type="button" hidden></button>
    </div>

    <main>
      <section id="explore" class="pane">
        <div class="pane-list">
          <input id="explore-query" class="input explore-search" type="search" autocomplete="off" data-i18n-attr="aria-label:explore.search,placeholder:explore.search">
          <div id="explore-filters" class="cluster scroll filter-bar" role="group" data-i18n-attr="aria-label:filter.label"></div>
          <div id="explore-decide" class="decide" role="region" aria-labelledby="explore-decide-title">
            <div class="decide-text"><h2 id="explore-decide-title" class="decide-title" data-i18n="explore.decideTitle"></h2><p class="decide-lead" data-i18n="explore.decideText"></p></div>
            <button id="explore-spin" class="button tonal" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#wheel"/></svg><span data-i18n="explore.decideSpin"></span></button>
          </div>
          <ul id="place-list" class="place-list"></ul>
          <p id="explore-none" class="empty-state inline" data-i18n="explore.noMatch" hidden></p>
          <div id="explore-empty" class="empty-state" hidden>
            <h2 class="empty-state-title" data-i18n="explore.emptyTitle"></h2>
            <p data-i18n="explore.empty"></p>
            <button id="explore-add" class="button primary" type="button" data-i18n="explore.add"></button>
          </div>
        </div>
        <article id="place-detail" class="pane-detail">
          <button id="place-back" class="button quiet pane-back" type="button" data-i18n="place.back"></button>
          <p id="place-pick" class="empty-state inline" data-i18n="place.pick"></p>
          <div id="place-view" class="place-view" hidden>
            <header class="place-head">
              <span id="place-tile" class="place-tile large"></span>
              <div class="place-head-text">
                <h2 id="place-title" class="place-title"></h2>
                <p id="place-meta" class="place-meta"></p>
                <p id="place-facts" class="place-facts"></p>
              </div>
              <button id="place-fav" class="button icon place-fav" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#heart"/></svg></button>
            </header>
            <div class="cluster">
              <a id="place-route" class="button tonal" target="_blank" rel="noopener" hidden><svg class="icon small" aria-hidden="true"><use href="icons.svg#route"/></svg><span data-i18n="place.route"></span></a>
              <button id="place-edit" class="button outline" type="button" data-i18n="place.edit"></button>
              <button id="place-delete" class="button outline danger" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="place.delete"></span></button>
            </div>
            <p id="place-remark" class="place-remark"></p>
            <div class="place-dishes-head"><h3 class="place-dishes-title" data-i18n="place.dishes"></h3><button id="dish-add" class="button outline" type="button" data-i18n="dish.add"></button></div>
            <ul id="place-dishes" class="dish-list"></ul>
            <p id="place-no-dishes" class="empty-state inline" data-i18n="place.noDishes"></p>
          </div>
        </article>
      </section>

      <section id="roulette" class="roulette" hidden>
        <div id="roulette-mode" class="segmented roulette-mode" role="group" data-i18n-attr="aria-label:roulette.mode"><button class="segment" type="button" data-mode="places" data-i18n="roulette.places"></button><button class="segment" type="button" data-mode="dishes" data-i18n="roulette.dishes"></button></div>
        <div id="roulette-filters" class="cluster scroll filter-bar" role="group" data-i18n-attr="aria-label:filter.label"></div>
        <div id="roulette-stage" class="roulette-stage">
          <div id="roulette-board" class="roulette-board">
            <h2 id="roulette-title" class="roulette-title"></h2>
            <p id="roulette-count" class="roulette-count" hidden></p>
            <div id="wheel" class="wheel">
              <span class="wheel-pointer"></span>
              <div id="wheel-disc" class="wheel-disc" role="img"></div>
              <button id="roulette-spin" class="button wheel-hub" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#wheel"/></svg><span data-i18n="roulette.spin"></span></button>
            </div>
            <p class="roulette-hint" data-i18n="roulette.hint"></p>
          </div>
          <article id="roulette-result" class="roulette-result" aria-labelledby="roulette-result-name" hidden>
            <p class="roulette-result-kicker" data-i18n="roulette.winner"></p>
            <div class="roulette-result-head">
              <span id="roulette-result-tile" class="place-tile large"></span>
              <div class="roulette-result-text">
                <h3 id="roulette-result-name" class="roulette-result-name" tabindex="-1"></h3>
                <p id="roulette-result-place" class="roulette-result-place" hidden></p>
                <p id="roulette-result-meta" class="roulette-result-meta"></p>
                <p id="roulette-result-facts" class="place-facts"></p>
              </div>
              <span id="roulette-result-price" class="roulette-result-price" hidden></span>
            </div>
            <a id="roulette-go" class="button primary wide" target="_blank" rel="noopener"><svg class="icon small" aria-hidden="true"><use href="icons.svg#route"/></svg><span data-i18n="roulette.go"></span></a>
            <div class="roulette-result-more">
              <button id="roulette-open" class="button tonal" type="button" data-i18n="roulette.open"></button>
              <button id="roulette-again" class="button tonal" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><span data-i18n="roulette.again"></span></button>
            </div>
          </article>
        </div>
        <div id="roulette-empty" class="empty-state" hidden>
          <h2 class="empty-state-title" data-i18n="roulette.emptyTitle"></h2>
          <p id="roulette-empty-text"></p>
          <button id="roulette-explore" class="button primary" type="button" data-i18n="roulette.explore"></button>
        </div>
      </section>

      <section id="settings" class="settings" hidden>
        <div id="account-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.account"></h2>
          <div class="list-group">
            <div id="account-row" class="settings-row"><span id="account-email" class="settings-row-label"></span></div>
            <button id="logout" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.logout"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="account-login" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.signIn"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.backup"></h2>
        <div class="list-group">
          <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="reset" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="settings.reset"></span></button>
        </div>
        <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
        <div class="list-group">
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.language"></span>
            <span id="language-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.hand"></span>
            <span id="hand-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.theme"></span>
            <span id="theme-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.modules"></h2>
        <div class="list-group">
          <label class="switch"><span data-i18n="nav.roulette"></span><input class="switch-input" type="checkbox" role="switch" data-module="roulette"></label>
        </div>
        <div id="install-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.app"></h2>
          <div class="list-group">
            <button id="install" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.install"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.help"></h2>
        <div class="list-group">
          <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
          <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>

    <button id="fab" class="fab" type="button" data-i18n-attr="aria-label:explore.add">+</button>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="explore">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#compass"/></svg>
        <span data-i18n="nav.explore"></span>
      </button>
      <button class="nav-item" type="button" data-view="roulette">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#wheel"/></svg>
        <span data-i18n="nav.roulette"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="place-sheet" class="sheet-layer" hidden>
      <div id="place-veil" class="sheet-veil"></div>
      <form id="place-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="place-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="place-sheet-title" class="sheet-title main"></h2><button id="place-close" class="button tonal" type="button" data-i18n="place.close"></button></header>
        <div class="sheet-body">
          <label class="field"><input id="place-name" class="input field-input" type="text" maxlength="80" required data-i18n-attr="placeholder:place.name"><span class="field-label" data-i18n="place.name"></span></label>
          <label class="field"><select id="place-cuisine" class="select field-input"></select><span class="field-label" data-i18n="place.cuisine"></span></label>
          <label class="field"><input id="place-area" class="input field-input" type="text" maxlength="60" data-i18n-attr="placeholder:place.area"><span class="field-label" data-i18n="place.area"></span></label>
          <fieldset class="place-group">
            <legend class="field-label" data-i18n="place.tier"></legend>
            <div class="segmented tier-picker"><button class="segment" type="button" data-tier="1" data-i18n="tier.1"></button><button class="segment" type="button" data-tier="2" data-i18n="tier.2"></button><button class="segment" type="button" data-tier="3" data-i18n="tier.3"></button><button class="segment" type="button" data-tier="4" data-i18n="tier.4"></button></div>
          </fieldset>
          <fieldset class="place-group">
            <legend class="field-label" data-i18n="place.rating"></legend>
            <div class="rating-picker"><button class="button icon rating-star" type="button" data-rating="1"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="2"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="3"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="4"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="5"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button></div>
          </fieldset>
          <fieldset class="place-group place-location">
            <legend class="field-label" data-i18n="location.title"></legend>
            <p id="place-location" class="place-location-pair"></p>
            <div class="cluster"><button id="location-here" class="button tonal" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#pin"/></svg><span data-i18n="location.here"></span></button><button id="location-clear" class="button outline" type="button" data-i18n="location.clear"></button></div>
            <div class="input-row"><input id="location-link" class="input" type="text" inputmode="url" data-i18n-attr="aria-label:location.paste,placeholder:location.paste"><button id="location-apply" class="button primary" type="button" data-i18n="location.apply"></button></div>
          </fieldset>
          <label class="field"><textarea id="place-note" class="input field-input" maxlength="280" rows="3" data-i18n-attr="placeholder:place.note"></textarea><span class="field-label" data-i18n="place.note"></span></label>
        </div>
        <footer class="sheet-foot"><button class="button primary wide" type="submit" data-i18n="place.save"></button></footer>
      </form>
    </div>

    <div id="dish-sheet" class="sheet-layer" hidden>
      <div id="dish-veil" class="sheet-veil"></div>
      <form id="dish-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="dish-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="dish-sheet-title" class="sheet-title main"></h2><button id="dish-close" class="button tonal" type="button" data-i18n="dish.close"></button></header>
        <div class="sheet-body">
          <label class="field"><input id="dish-name" class="input field-input" type="text" maxlength="80" required data-i18n-attr="placeholder:dish.name"><span class="field-label" data-i18n="dish.name"></span></label>
          <label class="field"><input id="dish-price" class="input field-input" type="text" inputmode="decimal" maxlength="12" data-i18n-attr="placeholder:dish.priceHint"><span class="field-label" data-i18n="dish.price"></span></label>
          <label class="switch"><span data-i18n="dish.star"></span><input id="dish-star" class="switch-input" type="checkbox" role="switch"></label>
          <fieldset class="place-group">
            <legend class="field-label" data-i18n="dish.rating"></legend>
            <div class="rating-picker"><button class="button icon rating-star" type="button" data-rating="1"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="2"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="3"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="4"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button><button class="button icon rating-star" type="button" data-rating="5"><svg class="icon" aria-hidden="true"><use href="icons.svg#star"/></svg></button></div>
          </fieldset>
          <label class="field"><textarea id="dish-note" class="input field-input" maxlength="280" rows="3" data-i18n-attr="placeholder:dish.note"></textarea><span class="field-label" data-i18n="dish.note"></span></label>
        </div>
        <footer class="sheet-foot"><button id="dish-delete" class="button outline danger" type="button" hidden><svg class="icon small" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="dish.delete"></span></button><button class="button primary wide" type="submit" data-i18n="dish.save"></button></footer>
      </form>
    </div>

    <div id="filter-sheet" class="sheet-layer" hidden>
      <div id="filter-veil" class="sheet-veil"></div>
      <section id="filter-dialog" class="sheet" role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="filter-sheet-title" class="sheet-title main"></h2><button id="filter-close" class="button tonal" type="button" data-i18n="filter.done"></button></header>
        <div class="sheet-body">
          <div id="filter-price" class="filter-part" hidden>
            <fieldset class="place-group">
              <legend class="field-label" data-i18n="filter.from"></legend>
              <div class="segmented tier-picker"><button class="segment" type="button" data-from="1" data-i18n="tier.1"></button><button class="segment" type="button" data-from="2" data-i18n="tier.2"></button><button class="segment" type="button" data-from="3" data-i18n="tier.3"></button><button class="segment" type="button" data-from="4" data-i18n="tier.4"></button></div>
            </fieldset>
            <fieldset class="place-group">
              <legend class="field-label" data-i18n="filter.to"></legend>
              <div class="segmented tier-picker"><button class="segment" type="button" data-to="1" data-i18n="tier.1"></button><button class="segment" type="button" data-to="2" data-i18n="tier.2"></button><button class="segment" type="button" data-to="3" data-i18n="tier.3"></button><button class="segment" type="button" data-to="4" data-i18n="tier.4"></button></div>
            </fieldset>
          </div>
          <div id="filter-distance" class="filter-part cluster" hidden></div>
          <div id="filter-cuisine" class="filter-part cluster" hidden></div>
          <form id="filter-max" class="filter-part" autocomplete="off" hidden>
            <p class="filter-hint" data-i18n="filter.maxPriceHint"></p>
            <div class="input-row"><input id="filter-max-input" class="input" type="text" inputmode="decimal" maxlength="12" data-i18n-attr="aria-label:filter.maxPrice,placeholder:dish.priceHint"><button class="button primary" type="submit" data-i18n="filter.apply"></button></div>
          </form>
        </div>
        <footer class="sheet-foot"><button id="filter-clear" class="button outline wide" type="button" data-i18n="filter.clear"></button></footer>
      </section>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <img class="onboarding-logo" src="./icons/logo.png" alt="">
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="welcome" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M90 50h60M90 74h44M90 98h52"/>
            <circle class="art-solid" cx="170" cy="130" r="18"/>
            <path class="art-on-solid" d="M170 122v16M162 130h16"/>
          </svg>
          <svg data-page="offline" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M96 70a34 34 0 0 1 48 0M106 82a20 20 0 0 1 28 0"/>
            <circle class="art-accent" cx="120" cy="96" r="4"/>
            <path d="M92 52l56 64"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title" class="onboarding-title"></h2>
          <p id="onboarding-text" class="onboarding-text"></p>
        </div>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" class="button outline quiet" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="button primary" type="button"></button>
      </div>
    </div>

    <section id="auth" class="account" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
      <div id="login" class="account-page">
        <img class="account-logo" src="./icons/logo.png" alt="">
        <h2 id="login-title" class="account-title" tabindex="-1" data-i18n="account.login.title"></h2>
        <p class="account-text" data-i18n="account.login.text"></p>
        <button id="login-google" class="button tonal wide" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#google"/></svg><span data-i18n="account.google"></span></button>
        <p id="login-error" class="input-help danger" role="alert" hidden></p>
        <button id="login-offline" class="button accent" type="button" data-i18n="account.offline"></button>
      </div>
      <div id="waiting" class="account-page" hidden>
        <svg class="icon account-wait" aria-hidden="true"><use href="icons.svg#refresh"/></svg>
        <h2 id="waiting-title" class="account-title" tabindex="-1" data-i18n="account.waiting.title"></h2>
        <p class="account-text" data-i18n="account.waiting.text"></p>
        <button id="waiting-check" class="button tonal wide" type="button" data-i18n="account.waiting.check"></button>
        <button id="waiting-logout" class="button accent" type="button" data-i18n="account.logout"></button>
